<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signing</title><style>/* INLINE_STYLE */</style></head><body>
<header><h1>Signing</h1><p>黑色手写签名 · 本地处理</p></header>
